# ╔════════════════════════════════════════════════════════════╗
# ║              OREOESSENTIALS COMMAND TOGGLE CONFIG          ║
# ║                                                            ║
# ║  Enable or disable any command individually.               ║
# ║  When disabled, the command will be completely removed.    ║
# ║                                                            ║
# ║  enabled: true  = Command works normally                   ║
# ║  enabled: false = Command is completely disabled           ║
# ╚════════════════════════════════════════════════════════════╝

# When a player tries to use a disabled command, show this message:
disabled-command-message: "&cThis command is currently disabled."

# ═══════════════════════════════════════════════════════════
#                    TELEPORTATION COMMANDS
# ═══════════════════════════════════════════════════════════

# SAFETY NOTE:
# The following vanilla-collision primaries are intentionally not managed here:
# tp, ban, kick, gamemode, clear, msg, enchant, kill, bossbar.
# CommandsAPI 5.1.1 does not create Oreo's Bukkit command when the primary
# label already exists, so CommandToggle cannot safely alias/disable those
# without risking the vanilla command. Fix those later at the CommandsAPI
# registration layer, not inside CommandToggleService.
