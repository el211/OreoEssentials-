name: OreoEssentials
version: "6.2"
main: fr.elias.oreoEssentials.OreoEssentials
api-version: "1.21"
folia-supported: true
description: "All-in-one essentials plugin with homes/warps/spawn, RTP, economy (Vault), chat tools, portals/jump pads, cross-server EC & player sync."
authors: [ "elias" ]

softdepend:
  - Vault
  - PlaceholderAPI
  - ItemsAdder
  - SmartInvs
  - PacketEvents

loadbefore: [EconomyShopGUI, VendingMachines, PerfRankNPCs, ajLeaderboards, ShopGUIPlus, DeluxeMenus, UltraEconomy, PlayerPoints, BetterShop, zShop, ShopKeepers, QuickShop, QuickShopHikari, GriefPrevention, Lands, Towny, BentoBox, AuctionHouse, CMI, JobsReborn, mcMMO, ChestShop, CrazyAuctions, SuperiorSkyblock2, IridiumSkyBlock, Guilds, Quests, VotingPlugin, EpicCrates, CrazyCrates, AdvancedEnchantments, Rankup, DeluxeRankup, Slimefun, Residence, HuskClaims, Skript, BetonQuest, LevelledMobs, CoinsEngine, PlayerWarps]

